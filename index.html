<style>

:root:not([data-theme="light"])[data-accent="forest"]{--pri:#4cc795}:root:not([data-theme="light"])[data-accent="sunset"]{--pri:#ff9a5c}:root:not([data-theme="light"])[data-accent="violet"]{--pri:#a78bfa}}
:root[data-theme="dark"]{--bg:#0c1120;--surf:#151c30;--surf2:#1c2540;--ink:#e9eeff;--mut:#97a4c6;--line:#25304c;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--ok:#3ecf9a;--bad:#ff7d72;--b1:#44c58a;--b2:#6c9bff;--c1:#a78bfa;--c2:#ff9a5c;--pri:#6c9bff;--pri-ink:#0c1120}
:root[data-theme="dark"][data-accent="forest"]{--pri:#4cc795}:root[data-theme="dark"][data-accent="sunset"]{--pri:#ff9a5c}:root[data-theme="dark"][data-accent="violet"]{--pri:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

a{color:var(--pri)}
.mut{color:var(--mut);font-size:.9rem}.sm{font-size:.85rem}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 55%,#000));display:grid;place-items:center;color:var(--pri-ink)}
.top b{font-size:1.05rem}.sp{flex:1}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 60%,#1a0f4d));color:var(--pri-ink);border:0;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--sh);display:flex;gap:16px;align-items:center}
.hero .mut{color:inherit;opacity:.85}.hero h2{font-size:1.5rem}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:11px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s;text-decoration:none}
.btn:active{transform:scale(.97)}.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:transparent}.btn.ghost{background:transparent}.btn.block{width:100%}.btn.sm{padding:7px 12px;font-size:.85rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}

.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surf))}.opt.sel .k{background:var(--pri);color:var(--pri-ink)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surf))}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surf))}.opt.wrong .k{background:var(--bad);color:#fff}

.words{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;border-radius:14px}
.words.built{background:var(--surf2);border:2px dashed var(--line)}
.w{font:inherit;padding:8px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;font-weight:500}.w:disabled{opacity:.3}
.fb{border-radius:14px;padding:14px;margin-top:14px;animation:up .25s ease-out}
.fb.ok{background:color-mix(in srgb,var(--ok) 13%,var(--surf));border:1px solid var(--ok)}.fb.no{background:color-mix(in srgb,var(--bad) 11%,var(--surf));border:1px solid var(--bad)}
.fb b{display:flex;gap:8px;align-items:center}
.actionbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:11}
.actionbar>div{max-width:720px;margin:auto}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view{animation:up .22s ease-out}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
table.t{width:100%;border-collapse:collapse}table.t td{padding:8px 4px;border-top:1px solid var(--line);font-size:.92rem}table.t tr:first-child td{border-top:0}
.big{font-size:2.6rem;font-weight:800;letter-spacing:-.02em}
details{margin:10px 0}summary{cursor:pointer;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}.swatch.on{border-color:var(--ink)}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}label.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--pri)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sheet label{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--mut);font-weight:600}
.sheet input{padding:8px 8px;border-radius:10px;font-size:.95rem;text-align:center;min-width:0}
.timer{font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:700}
</style>

<script>
/* ================= ESTADO Y AJUSTES ================= */
const KEY='ascenso-v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{};
Object.assign(S,{level:S.level||'B1',placed:!!S.placed,done:S.done||{},cards:S.cards||{},stats:S.stats||{},hist:S.hist||[],real:S.real||[]});
S.passed=S.passed||{};
S.set=Object.assign({theme:'auto',accent:'ocean',font:1,rate:.9,voice:''},S.set||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
const nd=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const today=()=>new Date().toISOString().slice(0,10);
const ORD=['A2','B1','B2','C1','C2'];
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
function applySet(){const r=document.documentElement;S.set.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.set.theme;r.dataset.accent=S.set.accent;r.style.setProperty('--fs',S.set.font)}
applySet();
/* ================= REPASO ESPACIADO ================= */
const BOX=[0,1,3,7,14,30];
const qid=(u,i)=>u.id+'#'+i;
function review(id,ok){const c=S.cards[id]||{b:0};c.b=ok?Math.min(5,c.b+1):0;c.due=new Date(Date.now()+BOX[c.b]*864e5).toISOString().slice(0,10);S.cards[id]=c}
function dueList(){const t=today(),o=[];U.forEach(u=>u.q.forEach((q,i)=>{const c=S.cards[qid(u,i)];if(c&&c.due<=t)o.push({u,q,i})}));return o}
function errList(){const o=[];U.forEach(u=>u.q.forEach((q,i)=>{const c=S.cards[qid(u,i)];if(c&&c.b===0)o.push({u,q,i})}));return o}
function stat(cat,ok){const s=S.stats[cat]||{ok:0,n:0};s.n++;if(ok)s.ok++;S.stats[cat]=s}
function weak(){return Object.entries(S.stats).filter(([c,s])=>s.n>=3&&s.ok/s.n<.7&&U.some(u=>u.t===c)).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([c,s])=>({c,p:Math.round(100*s.ok/s.n)}))}
const unitPct=u=>{const d=S.done[u.id];return d?Math.min(100,Math.round(100*d.best/u.q.length)):0};
const unitsOf=L=>U.filter(u=>u.l===L);
const mastery=L=>{const us=L?unitsOf(L):U;return us.length?Math.round(100*us.filter(u=>unitPct(u)>=70).length/us.length):0};
function ring(p,size,sw,label){const r=(size-sw)/2,c=2*Math.PI*r;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${p}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="currentColor" font-size="${size*.26}" font-weight="800">${label===undefined?p+'%':label}</text></svg>`}
const unitIcon=u=>/-dic$|-lis$/.test(u.id)?'phones':/-read$/.test(u.id)?'book':'pen';
/* ================= NAVEGACIÓN ================= */
let tab='hoy',run=null,sub=null;
function renderNav(){const d=dueList().length+vDueAll(),t=[['hoy','home','Hoy'],['aprender','book','Aprender'],['practicar','target','Practicar'],['progreso','chart','Progreso'],['ajustes','sliders','Ajustes']];
 $('#nav').innerHTML='<div>'+t.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')" aria-label="${l}">${ic(i)}${l}${k==='practicar'&&d?`<span class="badge">${d>99?'99+':d}</span>`:''}</button>`).join('')+'</div>';
 $('#lvchip').innerHTML=`<span class="lv ${S.level}">${S.level}</span> nivel`}
function show(html){const v=$('#view');v.className='';v.innerHTML=html;void v.offsetWidth;v.className='view';window.scrollTo(0,0)}
function go(t,s){if(run&&run.iv)clearInterval(run.iv);if(rIv){clearInterval(rIv);rIv=null}run=null;document.body.classList.remove('focus');tab=t;sub=s||null;renderNav();({hoy:vHoy,aprender:vLearn,practicar:vPractice,progreso:vStats,ajustes:vSettings})[t](s)}
/* ================= HOY ================= */

function clase(id){const u=U.find(x=>x.id===id);tab='aprender';renderNav();document.body.classList.remove('focus');
 const nPre=(PRE[id]||[]).length;
 show(`<div class="row" style="margin-bottom:10px"><button class="icon" onclick="teach('${id}')" aria-label="Volver">${ic('left')}</button><span class="lv ${u.l}">${u.l}</span></div>
 <div class="card"><h2>${esc(u.t)}</h2><p class="mut">Hoy vamos a trabajar este tema paso a paso, como en clase:</p>
 <ol><li>Primero, <b>vocabulario nuevo</b> (${nPre} palabras).</li><li>Luego, la <b>explicación</b>, poco a poco y con ejemplos.</li><li>Después, <b>un ejercicio resuelto</b> por mí, para que veas el método.</li><li>Por último, <b>tus ejercicios</b>. Si fallas, te explico el porqué.</li></ol></div>

function teachSteps(u){const d=document.createElement('div');d.innerHTML=u.teach;const out=[];
 [...d.children].forEach(el=>{if(el.tagName==='TABLE'){el.querySelectorAll('tr').forEach(tr=>out.push('<table>'+tr.outerHTML+'</table>'))}else if(el.tagName==='UL'||el.tagName==='OL'){el.querySelectorAll('li').forEach(li=>out.push('<p>'+li.innerHTML+'</p>'))}else out.push(el.outerHTML)});
 return out.filter(x=>x.replace(/<[^>]*>/g,'').trim())}
const PROF=['Fíjate bien en esto:','Vamos con el siguiente punto:','Ahora mira este caso:','Esto es muy importante:','Y no olvides esto:'];
function claseExp(id,k){const u=U.find(x=>x.id===id),st=teachSteps(u);if(k>=st.length)return claseEj(id);

 show(`<div class="row" style="margin-bottom:10px"><span class="lv ${u.l}">${u.l}</span><b>${esc(u.t)}</b><span class="sp"></span><span class="chip">${k+1}/${st.length}</span></div>${shown}
 <p class="mut sm">${ic('vol')} Toca un ejemplo en cursiva para oírlo.</p>
 <div class="actionbar"><div class="row" style="flex-wrap:nowrap">${k?`<button class="btn" onclick="claseExp('${id}',${k-1})">Atrás</button>`:''}<button class="btn pri" style="flex:1" onclick="claseExp('${id}',${k+1})">${k+1<st.length?'Entendido, siguiente':'Entendido, veamos un ejemplo'}</button></div></div>`);
 window.scrollTo(0,document.body.scrollHeight)}

 show(`<div class="row" style="margin-bottom:10px"><span class="lv ${u.l}">${u.l}</span><b>${esc(u.t)}</b></div>
 <div class="card"><div class="mut sm"><b>Ejemplo resuelto por el profesor</b></div>
 ${q.k==='read'?`<div class="passage">${esc(q.x)}</div>`:''}<div class="q">${esc(q.p)}</div>
 ${q.o?q.o.map((o,j)=>`<div class="opt ${j===q.a?'right':''}" style="cursor:default"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></div>`).join(''):''}
 <div class="fb ok"><b>${ic('check')} Respuesta: ${esc(ans)}</b><div style="margin-top:6px"><b>Por qué:</b> ${esc(q.e||'')}</div></div></div>
 <p class="mut">Ahora te toca a ti. Si dudas, vuelve a leer la explicación: después de cada fallo te explicaré el motivo.</p>
 <div class="actionbar"><div class="row" style="flex-wrap:nowrap"><button class="btn" onclick="claseExp('${id}',0)">Repasar explicación</button><button class="btn pri" style="flex:1" onclick="lesson('${id}')">Empezar mis ejercicios</button></div></div>`)}

const PASS=70;
function finalReady(L){return unitsOf(L).every(u=>S.done[u.id])}
function finalCard(L,us){const p=S.passed[L],ready=finalReady(L),left=us.filter(u=>!S.done[u.id]).length,nx=ORD[ORD.indexOf(L)+1];
 return `<div class="card" style="background:var(--surf2);margin:12px 0 0;box-shadow:none"><div class="row"><div class="ico" style="--c:var(--${L.toLowerCase()})">${ic('target')}</div><div class="t" style="flex:1"><b>Examen final ${L}</b><div class="mut sm">${p?'Aprobado el '+p.d+' ('+p.pct+'%)':ready?'20 ejercicios, sin ayudas. Con '+PASS+'% o más '+(nx?'pasas a '+nx+'.':'completas el programa.'):'Completa las '+left+' unidades que te faltan para desbloquearlo.'}</div></div></div>
 <button class="btn ${p?'':'pri'} block" style="margin-top:10px" ${ready?'':'disabled'} onclick="finalExam('${L}')">${p?'Repetir examen':'Hacer el examen final'}</button></div>`}
function finalExam(L){const items=unitsOf(L).flatMap(u=>u.q.map((q,i)=>({u,q,i}))).sort(()=>Math.random()-.5).slice(0,20);
 if(!confirm('Examen final '+L+': '+items.length+' ejercicios, '+items.length+' minutos y sin explicaciones hasta el final. ¿Empezar?'))return;
 startRun(items,'Examen final '+L,{timer:items.length*60,exam:true,final:L})}
function finalEnd(r,ok,n,pct){const L=r.opt.final,nx=ORD[ORD.indexOf(L)+1],pass=pct>=PASS;

 save();renderNav();

 show(`<div class="card" style="text-align:center"><div style="color:${pass?'var(--ok)':'var(--bad)'};display:flex;justify-content:center">${ring(pct,120,11)}</div>
 <h2 style="margin-top:10px">${pass?(nx?'¡Aprobado! Pasas a '+nx:'¡Programa completado!'):'Aún no llegas al '+PASS+'%'}</h2>
 <p class="mut">${ok} de ${n} correctas.${pass?'':' Repasa los temas débiles y vuelve a intentarlo cuando quieras.'}</p>
 <table class="t" style="text-align:left">${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right;color:${v[0]/v[1]<.7?'var(--bad)':'var(--ok)'}">${v[0]}/${v[1]}</td></tr>`).join('')}</table></div>
 ${r.miss.length?`<div class="card"><h3>Revisa tus fallos</h3>${r.miss.map(m=>`<div class="fb no"><div>${esc(m.p)}</div><b>${esc(m.ans)}</b><div class="mut sm"><b>Explicación:</b> ${esc(m.e||'')}</div></div>`).join('')}</div>`:''}
 ${!pass&&weakT.length?`<p class="mut">Temas a reforzar: ${weakT.map(esc).join(', ')}.</p>`:''}
 <div class="row"><button class="btn pri" onclick="${pass&&nx?"lvSel='"+nx+"';go('aprender')":"go('aprender')"}">${pass&&nx?'Empezar '+nx:'Volver a Aprender'}</button><button class="btn" onclick="go('hoy')">Hoy</button></div>`);
 run=null}

const fmt=s=>Math.max(0,Math.floor(s/60))+':'+String(Math.max(0,s%60)).padStart(2,'0');
function speak(t,rate){rate=rate||S.set.rate;if(window.AndroidTTS){try{AndroidTTS.setVoice(S.set.voice||'');AndroidTTS.speak(t,rate);return}catch(e){}}try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=rate;const v=speechSynthesis.getVoices().find(x=>x.name===S.set.voice)||speechSynthesis.getVoices().find(x=>/en-GB/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const TYPE={mc:'Elige la opción correcta',gap:'Completa la frase',wf:'Formación de palabras',kw:'Transformación',ro:'Ordena la frase',lis:'Comprensión oral',read:'Comprensión lectora',dic:'Dictado'};
const HOW={mc:'Lee la pregunta y toca la opción correcta (también puedes pulsar 1–4).',gap:'Escribe en inglés la palabra o palabras que faltan en el hueco (___). Respeta lo que indica el paréntesis.',wf:'Transforma la palabra en MAYÚSCULAS (entre paréntesis) para que encaje en la frase y escribe solo la nueva palabra.',kw:'Reescribe la idea con la palabra clave indicada, sin cambiar el significado. Escribe solo las palabras que faltan.',ro:'Toca las palabras en el orden correcto para formar la frase. Toca una palabra de arriba para quitarla.',lis:'Pulsa «Escuchar», oye el audio (puedes repetirlo o ponerlo más lento) y elige la respuesta a la pregunta.',read:'Lee el texto y elige la opción que responde a la pregunta.',dic:'Pulsa «Escuchar» y escribe en inglés exactamente lo que oyes. No importan las mayúsculas ni la puntuación.'};
function startRun(items,title,opt){if(!items.length)return;run={items:items.map(x=>({...x})),title,opt:opt||{},n:0,log:[],miss:[],done:false,ans:null,bi:[]};
 if(run.opt.timer){run.t0=Date.now();run.iv=setInterval(tick,1000)}ex()}
function tick(){if(!run||!run.opt.timer)return;const left=run.opt.timer-Math.floor((Date.now()-run.t0)/1000);const el=$('#clock');if(el)el.innerHTML=ic('clock')+' '+fmt(left);if(left<=0)finish()}
function quitRun(){if(!run||confirm('¿Salir de la sesión? Se pierde el progreso de esta tanda.'))go(tab)}
function ex(){
 if(run.n>=run.items.length)return finish();
 const it=run.items[run.n],{u,q}=it;run.ans=null;run.bi=[];run.done=false;document.body.classList.add('focus');
 let h=`<div class="run"><button class="icon" onclick="quitRun()" aria-label="Salir">${ic('x')}</button><div class="bar"><i style="width:${100*run.n/run.items.length}%"></i></div>${run.opt.timer?`<span class="chip" id="clock">${ic('clock')} ${fmt(run.opt.timer)}</span>`:`<span class="chip">${run.n+1}/${run.items.length}</span>`}</div>
 <div class="card"><div class="row"><span class="lv ${u.l}">${u.l}</span><span class="mut sm">${TYPE[q.k]||''}${it.retry?' · repetición del fallo':''}</span></div><div class="how">${ic('alert')}<span><b>Qué hacer:</b> ${HOW[q.k]||''}</span></div>`;
 if(q.k==='read')h+=`<div class="passage">${esc(q.x)}</div>`;
 if(q.k==='lis'||q.k==='dic')h+=`<div class="row" style="margin-top:10px"><button class="btn pri" onclick="speak(run.items[run.n].q.s)">${ic('vol')} Escuchar</button><button class="btn" onclick="speak(run.items[run.n].q.s,.6)">Más lento</button></div>`;
 h+=`<div class="q">${esc(q.p)}</div>`;
 if(q.o)h+=q.o.map((o,j)=>`<button class="opt" onclick="pick(${j})"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('');
 else if(q.k==='ro'){run.bank=[...q.w].sort(()=>Math.random()-.5);h+=`<div class="words built" id="built"></div><div class="words" id="bank"></div>`}
 else h+=`<input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.k==='dic'?'Escribe lo que oyes':'Escribe tu respuesta'}" onkeydown="if(event.key==='Enter'){event.preventDefault();check()}">`;
 h+=`<div id="fb"></div></div><div class="actionbar"><div><button class="btn pri block" id="chk" onclick="check()">${run.opt.exam?'Siguiente':'Comprobar'}</button></div></div>`;
 show(h);if(q.k==='ro')roDraw();const i=$('#inp');if(i&&q.k!=='dic')i.focus();
 if(q.k==='lis'||q.k==='dic')setTimeout(()=>speak(q.s),350)}
function roDraw(){$('#built').innerHTML=run.bi.map((j,k)=>`<button class="w" onclick="roUndo(${k})">${esc(run.bank[j])}</button>`).join('');$('#bank').innerHTML=run.bank.map((w,j)=>`<button class="w" ${run.bi.includes(j)?'disabled':''} onclick="roAdd(${j})">${esc(w)}</button>`).join('')}
function roAdd(j){if(run.done)return;run.bi.push(j);roDraw()}
function roUndo(k){if(run.done)return;run.bi.splice(k,1);roDraw()}
function pick(j){if(run.done)return;run.ans=j;document.querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('sel',k===j))}
function check(){
 if(!run)return;if(run.done)return next();
 const it=run.items[run.n],{u,q,i}=it;let ok,given='';
 if(q.o){if(run.ans===null)return;ok=run.ans===q.a}

 const cats=Object.entries(S.stats).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n),tot=Object.values(S.stats).reduce((a,s)=>a+s.n,0),okk=Object.values(S.stats).reduce((a,s)=>a+s.ok,0);

 <div class="card"><h3>Temario dominado por nivel</h3><table class="t">${ORD.map(L=>`<tr><td><span class="lv ${L}">${L}</span></td><td style="width:60%"><div class="bar"><i style="width:${mastery(L)}%"></i></div></td><td style="text-align:right">${mastery(L)}%</td></tr>`).join('')}</table><p class="mut sm">Una unidad cuenta como dominada con 70 % o más de aciertos.</p></div>
 <div class="card"><h3>Aciertos por categoría</h3>${cats.length?`<table class="t">${cats.map(([c,s])=>{const p=Math.round(100*s.ok/s.n);return `<tr><td>${esc(c)}</td><td style="width:34%"><div class="bar"><i style="width:${p}%;background:${p<70?'var(--bad)':'var(--ok)'}"></i></div></td><td style="text-align:right">${p}%</td></tr>`}).join('')}</table>`:'<p class="mut">Completa alguna lección para ver tu diagnóstico.</p>'}</div>
 <div class="card"><h3>Últimas sesiones</h3>${S.hist.length?`<table class="t">${S.hist.slice(-8).reverse().map(h=>`<tr><td class="mut">${h.d}</td><td>${esc(h.t)}</td><td style="text-align:right">${h.pct}%</td></tr>`).join('')}</table>`:'<p class="mut">Sin sesiones todavía.</p>'}</div>`)}
/* ================= AJUSTES ================= */
const ACC={ocean:'#2f6fed',forest:'#1f9d6b',sunset:'#e0662a',violet:'#7c4dff'};
function setS(k,v){S.set[k]=v;save();applySet();vSettings()}
function vSettings(){
 show(`<h2 style="margin-bottom:12px">Ajustes</h2>
 <div class="card"><h3>Apariencia</h3><div class="mut sm" style="margin:8px 0 4px">Tema</div><div class="seg">${[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(([k,l])=>`<button class="${S.set.theme===k?'on':''}" onclick="setS('theme','${k}')">${l}</button>`).join('')}</div>
 <div class="mut sm" style="margin:8px 0 6px">Color</div><div class="row">${Object.entries(ACC).map(([k,c])=>`<button class="swatch ${S.set.accent===k?'on':''}" style="background:${c}" onclick="setS('accent','${k}')" aria-label="Color ${k}"></button>`).join('')}</div>
 <div class="mut sm" style="margin:14px 0 4px">Tamaño del texto</div><div class="seg">${[[.9,'Pequeño'],[1,'Normal'],[1.15,'Grande']].map(([v,l])=>`<button class="${S.set.font===v?'on':''}" onclick="setS('font',${v})">${l}</button>`).join('')}</div>
 <div class="mut sm" style="margin:8px 0 4px">Velocidad de la voz: <b id="rv">${S.set.rate.toFixed(2)}×</b></div>
 <input type="range" min="0.5" max="1.4" step="0.05" value="${S.set.rate}" style="width:100%;accent-color:var(--pri)" oninput="S.set.rate=+this.value;$('#rv').textContent=S.set.rate.toFixed(2)+'×';save()" aria-label="Velocidad de la voz">
 <div class="mut sm" style="margin:12px 0 4px">Voz</div>
 <select id="vsel" onchange="S.set.voice=this.value;save()" style="width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);margin-bottom:10px"><option value="">Voz por defecto del móvil</option></select>
 <button class="btn sm" onclick="speak('The quick brown fox jumps over the lazy dog.')">${ic('vol')} Probar voz</button></div>
 ${updCard()}
 <div class="card"><h3>Nivel de partida</h3><div class="seg" style="margin-top:8px">${ORD.map(x=>`<button class="${S.level===x?'on':''}" onclick="S.level='${x}';save();vSettings();renderNav()">${x}</button>`).join('')}</div><button class="btn sm" onclick="placement()">Repetir el diagnóstico</button></div>
 <div class="card"><h3>Copia de seguridad</h3><p class="mut sm">Tu progreso se guarda solo en este dispositivo. Si desinstalas la app, se pierde: copia el código y guárdalo (por ejemplo, en una nota).</p>
 <div class="row"><button class="btn sm" onclick="bkExport()">${ic('down')} Exportar</button><button class="btn sm" onclick="bkImport()">Importar</button></div><textarea id="bk" rows="4" style="display:none;margin-top:10px;font-size:.8rem" spellcheck="false"></textarea><div id="bkb" style="margin-top:8px"></div></div>
 <div class="card"><button class="tile" onclick="vReal()"><div class="ico">${ic('file')}</div><div class="t"><b>Exámenes reales</b><span class="mut">Material oficial de Cambridge</span></div>${ic('right')}</button>
 <button class="tile" onclick="vGuide()"><div class="ico">${ic('book')}</div><div class="t"><b>Guía del examen</b><span class="mut">Qué se evalúa en cada nivel</span></div>${ic('right')}</button>
 <button class="tile" onclick="if(confirm('¿Borrar TODO el progreso?')){localStorage.removeItem(KEY);location.reload()}"><div class="ico" style="--c:var(--bad)">${ic('alert')}</div><div class="t"><b>Borrar progreso</b><span class="mut">No se puede deshacer</span></div></button></div>
 <p class="mut sm" style="text-align:center" id="cnt">Ascenso · ${U.length} unidades · ${U.reduce((a,u)=>a+u.q.length,0)} ejercicios</p>`);fillVoices()}
function voiceList(){let l=[];
 if(window.AndroidTTS){try{l=JSON.parse(AndroidTTS.voices()).map(v=>({n:v.n,t:v.l.replace('_','-')+(v.o?'':' (requiere conexión)')+(v.q>=400?' · alta calidad':'')}))}catch(e){}}
 else{try{l=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).map(v=>({n:v.name,t:v.name+' · '+v.lang}))}catch(e){}}
 return l}
function fillVoices(){const sel=$('#vsel');if(!sel)return;const l=voiceList();l.sort((a,b)=>a.t.localeCompare(b.t));
 sel.innerHTML='<option value="">Voz por defecto del móvil</option>'+l.map((v,i)=>`<option value="${esc(v.n)}" ${S.set.voice===v.n?'selected':''}>${esc(v.t)}</option>`).join('');
 if(!l.length)sel.insertAdjacentHTML('afterend','<p class="mut sm">No se encontraron más voces en inglés. Instálalas en Ajustes de Android → Salida de texto a voz.</p>')}
try{speechSynthesis.onvoiceschanged=fillVoices}catch(e){}
function bkExport(){const t=$('#bk');t.style.display='block';t.value=JSON.stringify(S);t.select();$('#bkb').innerHTML='<button class="btn sm pri" onclick="bkCopy()">Copiar al portapapeles</button>'}
function bkCopy(){const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value);$('#bkb').innerHTML='<span class="mut sm">Copiado. Guárdalo en un sitio seguro.</span>'}catch(e){document.execCommand('copy')}}
function bkImport(){const t=$('#bk');t.style.display='block';t.value='';t.placeholder='Pega aquí el código de tu copia de seguridad';t.focus();$('#bkb').innerHTML='<button class="btn sm pri" onclick="bkApply()">Restaurar</button>'}
function bkApply(){try{const o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!o.cards||!o.stats)throw 0;if(!confirm('Esto reemplaza tu progreso actual. ¿Continuar?'))return;localStorage.setItem(KEY,JSON.stringify(o));location.reload()}catch(e){$('#bkb').innerHTML='<span style="color:var(--bad)" class="sm">El código no es válido.</span>'}}
/* ================= GUÍA DEL EXAMEN ================= */
const GUIDE={A2:{x:'A2 Key',t:'Entender y usar frases sencillas sobre rutina, familia y necesidades inmediatas.'},B1:{x:'B1 Preliminary',t:'Comprender y producir inglés en situaciones cotidianas: correos, anuncios, conversaciones.'},B2:{x:'B2 First',t:'Argumentar con fluidez, entender textos de actualidad y escribir ensayos, informes y reseñas.'},C1:{x:'C1 Advanced',t:'Uso flexible y preciso en contextos académicos y profesionales, con textos largos y matices.'},C2:{x:'C2 Proficiency',t:'Dominio casi nativo: tono, ironía, registro y estructuras complejas.'}};
function vGuide(){tab='hoy';renderNav();
 show(`<div class="row" style="margin-bottom:10px"><button class="icon" onclick="go('hoy')" aria-label="Volver">${ic('left')}</button><h2>Conoce tu examen</h2></div>
 <div class="card"><p>Los exámenes Cambridge evalúan cuatro destrezas: <b>Reading & Use of English</b>, <b>Writing</b>, <b>Listening</b> y <b>Speaking</b>. Consulta siempre el formato y los tiempos vigentes en <b>cambridgeenglish.org</b>, porque Cambridge los actualiza.</p></div>
 ${ORD.map(L=>`<div class="card"><div class="row"><span class="lv ${L}">${L}</span><b>${GUIDE[L].x}</b></div><p class="mut" style="margin:6px 0 10px">${GUIDE[L].t}</p>
 <table class="t"><tr><td><b>Reading y Use of English</b></td><td class="mut">Lecciones de gramática, léxico, formación de palabras, transformaciones y lectura</td></tr>
 <tr><td><b>Writing</b></td><td class="mut">Practicar → Escritura, con frases útiles y rúbrica</td></tr>
 <tr><td><b>Listening</b></td><td class="mut">Unidades de escucha y dictado</td></tr>
 <tr><td><b>Speaking</b></td><td class="mut">Practicar → Speaking: grábate y escúchate</td></tr></table></div>`).join('')}`)}
/* ================= ACTUALIZACIONES (solo en la app de Android) ================= */
const APP=window.AscensoApp||null;
const UPD={avail:null,state:'idle',pct:0,msg:''};
function updInner(){
 if(!APP)return'';
 let h='<h3>Actualizaciones</h3><div class="mut sm" style="margin:4px 0 8px">Versión instalada: '+esc(APP.versionName())+'</div>';
 if(UPD.state==='checking')h+='<p>Buscando actualizaciones…</p>';
 else if(UPD.state==='downloading')h+='<p>Descargando… '+UPD.pct+'%</p><div class="bar"><i style="width:'+UPD.pct+'%"></i></div>';
 else if(UPD.state==='ready')h+='<p><b>Versión '+esc(UPD.avail.versionName)+' lista para instalar.</b></p><button class="btn pri" onclick="updInstall()">Instalar ahora</button>';
 else if(UPD.avail)h+='<p><b>Hay una versión nueva: '+esc(UPD.avail.versionName)+'</b></p>'+(UPD.avail.notes&&UPD.avail.notes.length?'<ul class="mut sm">'+UPD.avail.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'')+'<button class="btn pri" onclick="updDownload()">Descargar e instalar</button>';
 else h+='<button class="btn sm" onclick="updCheck(true)">Buscar actualizaciones</button>';
 if(UPD.msg)h+='<p class="mut sm">'+esc(UPD.msg)+'</p>';
 return h}
function updCard(){return APP?'<div class="card" id="updbox">'+updInner()+'</div>':''}
function updRefresh(){const b=$('#updbox');if(b)b.innerHTML=updInner()}
function updCheck(manual){UPD.state='checking';UPD.msg='';updRefresh();APP.checkUpdate()}
window.__updCheck=r=>{UPD.state='idle';
 if(!r.ok){UPD.msg=r.error||'No se pudo comprobar.';}
 else if(r.info.versionCode>r.current){UPD.avail=r.info;UPD.msg=''}
 else{UPD.avail=null;UPD.msg='Tienes la última versión.'}
 try{localStorage.setItem('ascenso-lastcheck',String(Date.now()))}catch(e){}
 if(tab==='hoy'&&!run&&!sub&&UPD.avail)vHoy();else updRefresh()};
function updDownload(){UPD.state='downloading';UPD.pct=0;UPD.msg='';updRefresh();APP.downloadUpdate(UPD.avail.apk,UPD.avail.sha256||'')}
window.__updProgress=p=>{UPD.pct=p;updRefresh()};
window.__updDone=r=>{if(r.ok){UPD.state='ready'}else{UPD.state='idle';UPD.msg=r.error||'Falló la descarga.'}updRefresh()};
function updInstall(){if(!APP.canInstall()){UPD.msg='Android pide permiso para instalar: actívalo para Ascenso y vuelve a pulsar «Instalar ahora».';updRefresh();APP.allowInstall();return}APP.install()}
if(APP){let last=0;try{last=+localStorage.getItem('ascenso-lastcheck')||0}catch(e){}if(Date.now()-last>6*36e5)setTimeout(()=>{UPD.state='checking';APP.checkUpdate()},1500)}
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.AscensoApp)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('hoy');
</script>
